<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Bubble Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow for Speech Bubble -->
    <filter id="bubbleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Main Speech Bubble Shape -->
  <path filter="url(#bubbleShadow)" fill="url(#bgGrad)" d="
    M 56 28
    L 200 28
    A 28 28 0 0 1 228 56
    L 228 168
    A 28 28 0 0 1 200 196
    L 104 196
    L 52 232
    A 6 6 0 0 1 42 227
    L 42 196
    L 56 196
    A 28 28 0 0 1 28 168
    L 28 56
    A 28 28 0 0 1 56 28
    Z
  "/>

  <!-- Subtle Inner Translation Accent Dots / Sparkles -->
  <circle cx="70" cy="74" r="5" fill="#93C5FD" opacity="0.6"/>
  <circle cx="86" cy="74" r="5" fill="#93C5FD" opacity="0.8"/>
  <circle cx="102" cy="74" r="5" fill="#93C5FD" opacity="0.95"/>

  <!-- Sleek Geometric Lightning Bolt (The "Flash") -->
  <path filter="url(#glow)" fill="url(#boltGrad)" d="
    M 142 52
    L 94 130
    L 130 130
    L 114 204
    L 168 120
    L 134 120
    L 156 52
    Z
  "/>

  <!-- Lightning Bolt Edge Highlight for Extra Crispness -->
  <path fill="#FFFFFF" opacity="0.4" d="
    M 142 52
    L 124 82
    L 118 78
    L 136 52
    Z
  "/>
</svg>
